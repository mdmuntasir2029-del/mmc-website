<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/mmcwebsiteprev.png?v=3" />
    <link
      rel="preload"
      href="/fonts/stix-two-text-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The homepage hero's "mathematics" is set in this font and is
         part of the very first paint — without preloading it, the
         browser doesn't discover the font file until it's parsed the
         CSS and matched it against the DOM, by which point the fallback
         cursive font has already painted and visibly swaps a moment
         later. See font-display: optional on the @font-face itself for
         the other half of this fix. -->
    <link
      rel="preload"
      href="/fonts/cursive/dancing-script-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Every h1/h2 renders in this weight, including the rest of the
         homepage hero headline right next to "mathematics" above — same
         fix, same reason. -->
    <link
      rel="preload"
      href="/fonts/modern/barlow-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The homepage's LCP element is a photo whose URL is only known
         after a client-side Supabase fetch resolves — this can't start
         the DNS/TCP/TLS handshake to a brand-new origin early like it
         would for a same-origin resource. Preconnecting lets that
         handshake happen in parallel with the JS bundle downloading,
         instead of only starting once the fetch actually fires. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Manarat Mathletes Club — to infinity unbound."
    />
    <title>Manarat Mathletes Club</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
